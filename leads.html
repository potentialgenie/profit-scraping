<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vietnam history</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="leads.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">
        <img src="icons/icon128.png" alt="" width="38" height="38" />
      </span>
      <div class="brand-text">
        <span class="brand-name">Vietnam history</span>
        <span class="brand-sub">Preferred location or a past hire in Vietnam</span>
      </div>
    </div>

    <div class="topbar-right">
      <span class="status-pill" id="status">
        <span class="live-dot"></span><span id="statusText">—</span>
      </span>
      <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.4" fill="var(--surface)"/>
          <line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.4" fill="var(--surface)"/>
        </svg>
      </button>
      <button id="scrapeSearch" class="btn primary" title="Review each new job as it is posted">
        <svg class="btn-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span id="scrapeLabel">Start</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="summary">
      <div class="card">
        <div class="card-label">Jobs scanned</div>
        <div class="card-value" id="sumTotal">0</div>
      </div>
      <div class="card">
        <div class="card-label">Vietnam matches</div>
        <div class="card-value is-accent" id="sumVietnam">0</div>
      </div>
      <div class="card">
        <div class="card-label">Asked for Vietnam</div>
        <div class="card-value is-accent" id="sumLocation">0</div>
      </div>
      <div class="card">
        <div class="card-label">Couldn't check</div>
        <div class="card-value is-muted" id="sumFailed">0</div>
      </div>
    </section>

    <div class="banner" id="banner" hidden>
      <span id="bannerText"></span>
      <button type="button" class="banner-act" id="bannerAction"></button>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="tabs" id="filters" role="group" aria-label="Filter leads">
          <button type="button" class="chip active" data-filter="vietnam">Vietnam <span class="chip-count" id="cntVietnam">0</span></button>
          <button type="button" class="chip" data-filter="all">All jobs <span class="chip-count" id="cntAll">0</span></button>
          <button type="button" class="chip" data-filter="empty">No freelancer link <span class="chip-count" id="cntEmpty">0</span></button>
          <button type="button" class="chip" data-filter="failed">Couldn't check <span class="chip-count" id="cntFailed">0</span></button>
        </div>
        <div class="panel-head-right">
          <span class="result-count" id="resultCount"></span>
          <button type="button" class="btn ghost" id="copyLinks" title="Copy the job links in the current view">Copy links</button>
          <button type="button" class="btn ghost" id="exportCsv" title="Download the current view as CSV">Export CSV</button>
          <div class="search-wrap">
            <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="leadSearch" class="search" placeholder="Search jobs or freelancers…" />
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="jobs-table leads-table" id="leadsTable">
          <colgroup>
            <col style="width:280px" />
            <col />
            <col style="width:200px" />
            <col style="width:82px" />
            <col style="width:56px" />
          </colgroup>
          <thead>
            <tr>
              <th class="sortable" data-sort="title" data-type="str">Job</th>
              <th>Vietnam freelancers</th>
              <th>Other freelancers</th>
              <th class="sortable" data-sort="capturedAt" data-type="date">Found</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr><td colspan="5" class="empty-cell">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ─── Settings ─────────────────────────────────────────── -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Settings</h2>
        <button type="button" class="icon-btn modal-close" data-close aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <section class="modal-section">
          <h3>Search</h3>
          <label class="field">
            <span class="field-label">Search URL <span class="field-hint">opened when no search tab is already open</span></span>
            <input type="text" id="searchUrl" class="search field-input" spellcheck="false" />
          </label>
        </section>

        <section class="modal-section">
          <h3>Stored data</h3>
          <div class="field-row">
            <button type="button" class="btn danger" id="clearAll">Delete all jobs</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- ─── Lead detail ──────────────────────────────────────── -->
  <div id="detailDrawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="drawer-header">
        <div class="drawer-title-wrap">
          <h2 id="detailTitle">Lead</h2>
          <span class="drawer-sub" id="detailSub"></span>
        </div>
        <button type="button" class="icon-btn drawer-close" data-close aria-label="Close">&times;</button>
      </div>
      <div class="drawer-body" id="detailBody"></div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="leads.js"></script>
</body>
</html>
